<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عجلة الاختيار</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #15445a;
      --teal: #097a77;
      --gold: #c1b489;
      --gradient: linear-gradient(90deg, #07a869 0%, #0da9a6 50%, #3d7eb9 100%);
      --bg: #f5f8f7;
      --text-2: #44606d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: "Helvetica Neue W23 for SKY", "IBM Plex Sans Arabic", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--primary);
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; top: 0; left: 0; right: 0; height: 6px; background: var(--gradient); z-index: 2;
    }
    .blob { position: fixed; border-radius: 50%; z-index: 0; pointer-events: none; }
    .b1 { width: 420px; height: 420px; background: #e3f3f1; top: -160px; left: -160px; }
    .b2 { width: 360px; height: 360px; background: #e7eef5; bottom: -140px; right: -140px; }
    header {
      position: relative; z-index: 1; text-align: center; padding: 34px 16px 8px; width: 100%; max-width: 640px;
    }
    header img { height: 92px; width: auto; }
    .gold { width: 64px; height: 4px; border-radius: 2px; background: var(--gold); margin: 14px auto 10px; }
    h1 { margin: 0; font-size: 2rem; font-weight: 700; color: var(--primary); }
    .school { margin-top: 6px; font-size: .95rem; font-weight: 600; color: var(--text-2); line-height: 1.6; }
    .wheel {
      position: relative; z-index: 1;
      width: calc(100% - 32px); max-width: 500px; aspect-ratio: 1 / 1;
      margin: 18px 16px; padding: 14px;
      background: #fff; border: 4px solid var(--primary); border-radius: 28px;
      box-shadow: 0 10px 30px rgba(12, 46, 62, .12);
    }
    .wheel::after {
      content: ""; position: absolute; inset: -12px; border: 2px dashed var(--gold); border-radius: 38px; pointer-events: none;
    }
    .wheel iframe { width: 100%; height: 100%; border: 0; border-radius: 16px; display: block; }
    .people {
      position: relative; z-index: 1; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
      padding: 8px 16px 28px; width: 100%; max-width: 640px;
    }
    .person {
      flex: 1 1 240px; text-align: center; background: #fff; border: 1px solid #d6e4e6; border-top: 4px solid #0da9a6;
      border-radius: 14px; padding: 10px 14px;
    }
    .person .r { font-size: .85rem; color: #687f89; }
    .person .n { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-top: 2px; }
    footer {
      position: relative; z-index: 1; margin-top: auto; width: 100%; text-align: center;
      background: #0c2e3e; color: #cfe3e7; font-size: .85rem; padding: 12px 16px;
      border-top: 3px solid var(--gold);
    }
    footer b { color: #fff; }
  </style>
</head>
